<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trello Clone</title>
</head>
<body>
  <div class="board">

    <div class="column" data-id="todo">
      <h2 class="column-title">TODO</h2>
      <div class="cards-container"></div>
        <div class="add-card-block">
          <button class="add-button">+ Add another card</button>
          <div class="form-container hidden">
            <textarea class="card-input" placeholder="Enter a title for this card..."></textarea>
            <div class="form-actions">
              <button class="save-button">Add Card</button>
              <button class="cancel-button">×</button>
            </div>
          </div>
        </div>
    </div>

    <div class="column" data-id="in-progress">
      <h2 class="column-title">IN PROGRESS</h2>
      <div class="cards-container"></div>
      <div class="add-card-block">
        <button class="add-button">+ Add another card</button>
        <div class="form-container hidden">
          <textarea class="card-input" placeholder="Enter a title for this card..."></textarea>
          <div class="form-actions">
            <button class="save-button">Add Card</button>
            <button class="cancel-button">×</button>
          </div>
        </div>
      </div>
    </div>

    <div class="column" data-id="done">
      <h2 class="column-title">DONE</h2>
      <div class="cards-container"></div>
      <div class="add-card-block">
        <button class="add-button">+ Add another card</button>
        <div class="form-container hidden">
          <textarea class="card-input" placeholder="Enter a title for this card..."></textarea>
          <div class="form-actions">
            <button class="save-button">Add Card</button>
            <button class="cancel-button">×</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
